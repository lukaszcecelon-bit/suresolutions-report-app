name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Bez limitu zawieszony krok blokuje publikację godzinami: 2026-08-19
    # `playwright install` stał 3,5 h bez postępu i deploy v1.0 nie wyszedł,
    # a nikt tego nie widział. Lepiej szybka porażka niż cicha cisza.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Smoke test E2E przeciwko zbudowanej apce (vite preview) — łapie
      # regresje storage/routingu/generowania PDF PRZED publikacją.
      # BEZ `--with-deps`: ten wariant odpala apt-get i to on się zawieszał.
      # Obraz ubuntu-latest ma biblioteki systemowe Chromium na pokładzie, więc
      # pobieramy samą przeglądarkę. Gdyby zaczęło brakować bibliotek, test
      # padnie od razu z jasnym błędem — wtedy wraca `--with-deps`.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:e2e
        timeout-minutes: 6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
